# Runs on every push and pull request: the releases match their own checksums,
# the open part of the pipeline re-derives them byte for byte, the Python
# package's data is exactly those releases, and both packages' tests pass
# against the installed wheels.
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Every release matches its SHA256SUMS and manifest
        run: python3 scripts/verify.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: The releases re-derive from the pipeline, byte for byte
        run: node pipeline/rebuild.mjs --check

      # pyarrow pinned to the version that wrote the committed Parquet files (it
      # stamps itself into each), so a rebuild is byte-identical.
      - name: Install tooling
        run: python3 -m pip install --quiet --upgrade pip build "pyarrow==25.0.1" pytest

      - name: The package's data is the releases, byte for byte
        run: python3 scripts/build-package.py --check

      - name: Build and test the packages as installed
        run: |
          set -euo pipefail
          python3 -m build --outdir dist python/uavocab
          python3 -m build --outdir dist python/ukvocab
          python3 -m pip install --quiet dist/uavocab-*.whl dist/ukvocab-*.whl
          python3 -m pytest -q python/uavocab/tests python/ukvocab/tests
