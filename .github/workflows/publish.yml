# Publish a Python package from this repository to PyPI, by hand.
#
#   uavocab   the package (python/uavocab)
#   ukvocab   the old name's compatibility release (python/ukvocab): no data,
#             depends on uavocab, re-exports it. Publish uavocab first.
#
# Why here: this is the public repository the packages' Source links point at,
# so PyPI's record of which repository and workflow built each release (its
# provenance attestation) is a page anyone can open, and PyPI marks this
# repository's links on the project page as verified.
#
# A release cannot be unpublished (PyPI refuses a re-upload of a version
# forever, yanked or not), so:
#
#   workflow_dispatch ONLY. No push trigger, no schedule.
#   The version must be typed, and it must equal the package's pyproject.toml.
#   TestPyPI is the default target. The real index is a deliberate choice.
#   Everything is verified before the upload: every release folder against its
#     SHA256SUMS (scripts/verify.py), the package data against those releases
#     byte for byte (scripts/build-package.py --check), the wheel with twine,
#     and the package's own tests run AGAINST THE INSTALLED WHEEL.
#   A version the index already has is refused with a message.
#   ukvocab is refused until uavocab of the same version is on the same index.
#   It writes nothing to this repository.
#
# CREDENTIAL: PyPI trusted publishing (OIDC), nothing stored. Each project
# registers this repository once on pypi.org (and test.pypi.org for the
# rehearsal): owner jake0lawrence, repository UA-Vocab, workflow publish.yml,
# environment pypi (or testpypi). Without that the run verifies everything and
# fails at the upload with those fields, so the failure is the instruction.
#
# Generated by scripts/uavocab/build-open-repo.mjs in the study's source
# repository, like everything here; regenerate rather than edit.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      package:
        description: "uavocab is the package. ukvocab is the old name's compatibility release; publish it only after uavocab of the same version is on the same index."
        required: true
        type: choice
        default: uavocab
        options:
          - uavocab
          - ukvocab
      target:
        description: "testpypi rehearses against test.pypi.org. pypi publishes for real and cannot be undone."
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
      version:
        description: "The version to publish, exactly as in python/<package>/pyproject.toml (for instance 0.5.0)."
        required: true
        type: string

# id-token: write is what trusted publishing needs to mint the OIDC token.
# contents: read is for the checkout. Nothing here needs more.
permissions:
  contents: read
  id-token: write

env:
  PKG: ${{ inputs.package }}
  PKG_DIR: python/${{ inputs.package }}

# One release at a time, never cancelled mid-upload.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Part of the trusted-publisher registration on PyPI.
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pyarrow pinned to the version that wrote the committed Parquet files (it
      # stamps itself into each), so the rebuild check is byte-identical.
      - name: Install tooling
        run: python3 -m pip install --quiet --upgrade pip build twine pytest "pyarrow==25.0.1"

      - name: Confirm the name and version match pyproject.toml
        env:
          ASKED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read -r NAME HAVE < <(python3 -c 'import tomllib,os; p=tomllib.load(open(os.environ["PKG_DIR"]+"/pyproject.toml","rb"))["project"]; print(p["name"], p["version"])')
          if [ "$NAME" != "$PKG" ]; then
            echo "::error::$PKG_DIR/pyproject.toml names the project $NAME, not $PKG. Nothing was built."
            exit 1
          fi
          if [ "$ASKED" != "$HAVE" ]; then
            echo "::error::Asked to publish $ASKED but $PKG_DIR/pyproject.toml says $HAVE. Nothing was built."
            exit 1
          fi
          echo "publishing $PKG $HAVE to ${{ inputs.target }}"

      - name: Refuse a version the index already has
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "pypi" ]; then BASE="https://pypi.org"; else BASE="https://test.pypi.org"; fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$BASE/pypi/$PKG/$VERSION/json" || true)"
          if [ "$CODE" = "200" ]; then
            echo "::error::$PKG $VERSION is already on $BASE. An index never accepts the same version twice; bump the version."
            exit 1
          fi
          echo "$BASE has no $PKG $VERSION (HTTP $CODE); clear to publish."

      # The old name depends on the new one, so the new one must already be on
      # the index this run targets, at a version the old name accepts.
      - name: For ukvocab, require uavocab on the same index first
        if: inputs.package == 'ukvocab'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "pypi" ]; then BASE="https://pypi.org"; else BASE="https://test.pypi.org"; fi
          WANT="$(python3 -c 'import tomllib; print(tomllib.load(open("python/uavocab/pyproject.toml","rb"))["project"]["version"])')"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$BASE/pypi/uavocab/$WANT/json" || true)"
          if [ "$CODE" != "200" ]; then
            echo "::error::uavocab $WANT is not on $BASE yet (HTTP $CODE). Publish uavocab first; ukvocab depends on it."
            exit 1
          fi
          echo "uavocab $WANT is on $BASE."

      - name: Every release matches its SHA256SUMS and manifest
        run: python3 scripts/verify.py

      - name: The package data is the releases, byte for byte
        run: python3 scripts/build-package.py --check

      - name: Build
        run: |
          set -euo pipefail
          python3 -m build --outdir dist "$PKG_DIR"
          python3 -m twine check dist/*
          ls -la dist

      # Install the wheel, not the source tree, and test that.
      - name: Test the installed wheel (uavocab)
        if: inputs.package == 'uavocab'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet dist/uavocab-*.whl
          python3 - <<'PY'
          import uavocab
          s = uavocab.sources()
          assert s["package"] == "uavocab", s["package"]
          assert uavocab.__version__ == s["package_version"], (uavocab.__version__, s["package_version"])
          assert s["combined_license"] == "CC-BY-NC-SA-4.0", s["combined_license"]
          assert s["site"].startswith("https://uavocab.org/"), s["site"]
          for name, d in s["datasets"].items():
              assert d["license"] in ("CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-NC-SA-4.0"), (name, d["license"])
              if d["license"] == "CC-BY-NC-SA-4.0":
                  assert "PULS" in d["attribution"], name
          hit = uavocab.lookup("тож")
          assert hit and hit["level"], hit
          print("installed", uavocab.__version__, s["combined_license"], "lookup ok")
          PY
          python3 -m pytest -q python/uavocab/tests

      # The old name: install this build with uavocab from the index it targets
      # (checked above), so the dependency resolves the way a reader's pip will.
      - name: Test the installed wheel (ukvocab)
        if: inputs.package == 'ukvocab'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "pypi" ]; then
            python3 -m pip install --quiet dist/ukvocab-*.whl
          else
            python3 -m pip install --quiet --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ dist/ukvocab-*.whl
          fi
          if python3 -W error::FutureWarning -c 'import ukvocab' 2>/dev/null; then
            echo "::error::import ukvocab raised no FutureWarning naming uavocab"
            exit 1
          fi
          python3 -m pytest -q python/ukvocab/tests

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true

      - name: Say what to do if the upload was refused
        if: failure()
        run: |
          echo "::error::If every step above the upload passed, the package is sound and the index refused the credential. Register this repository as a trusted publisher on ${{ inputs.target == 'pypi' && 'pypi.org' || 'test.pypi.org' }} (for a project's first release: Your account > Publishing > Add a new pending publisher; for an existing project: Your projects > ${{ inputs.package }} > Publishing) with owner jake0lawrence, repository UA-Vocab, workflow publish.yml, environment ${{ inputs.target }}. Then dispatch again. Nothing was published."

      - name: Say where it landed
        run: |
          if [ "${{ inputs.target }}" = "pypi" ]; then
            echo "::notice::$PKG ${{ inputs.version }} is on PyPI: pip install $PKG==${{ inputs.version }}"
          else
            echo "::notice::Rehearsal only. $PKG ${{ inputs.version }} is on test.pypi.org: pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ $PKG==${{ inputs.version }}"
          fi
